[project]
name = "cardvault"
version = "0.1.0"
description = "TCG collection manager: catalog, holdings, prices, decks (replaces the notebook pipeline)"
requires-python = ">=3.12"
dependencies = [
    "Django~=5.2.0",
    "django-htmx~=1.19",
    "openpyxl~=3.1",
    "rapidfuzz~=3.9",
    "environs~=11.0",
    # Selenium ≥4.6 resolves chromedriver itself (Selenium Manager); the old
    # webdriver-manager dependency is gone — its downloads got SIGKILLed by
    # macOS Gatekeeper.
    "selenium~=4.27",
    "google-api-python-client~=2.150",
    "google-auth~=2.35",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-django~=4.9",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cardvault.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["E501"]
